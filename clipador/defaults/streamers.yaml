# Clipador GTA 6 — lista de streamers e ajustes.
# O @, a chave do Groq e a nota mínima ficam salvos pelo painel (Ferramentas → Configurações),
# fora desta pasta: atualizar o Clipador não apaga nada.
# Cada streamer pode ter vários canais; o sistema grava o que estiver ao vivo.

settings:
  pre_s: 43            # segundos antes do pico (sem IA)
  post_s: 15           # segundos depois do pico (sem IA)
  min_clip_s: 45       # duração mínima do corte
  max_clip_s: 60       # duração máxima (teto: 60)
  min_score: 7         # nota mínima da IA (0-10) pra virar clipe
  hype_threshold: 3.0
  cooldown_s: 120
  max_per_hour: 6
  max_live: 12
  require_gta: true
  handle: "@seuperfil"
  accent: "#FF2E63"
  card_seconds: 4
  quality: "1080p60,1080p,936p60,900p60,720p60,720p,best"   # HD: webcam nítida (menos internet: 720p60,720p,480p,best)

