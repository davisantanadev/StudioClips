# Clipador GTA 6 — lista de streamers e ajustes.
# O @, a chave do Groq e a nota mínima ficam salvos pelo painel (Ferramentas → Configurações),
# fora desta pasta: atualizar o Clipador não apaga nada.
# Cada streamer pode ter vários canais (Twitch, Kick, YouTube); o sistema grava o primeiro que estiver
# ao vivo, então ponha primeiro a plataforma principal dele. No YouTube vale @handle ou o ID do canal (UC…).
# Canais conferidos nas plataformas em 19/11/2026. Quem não estiver jogando GTA não é gravado (require_gta).

settings:
  pre_s: 43            # segundos antes do pico (sem IA)
  post_s: 15           # segundos depois do pico (sem IA)
  min_clip_s: 45       # duração mínima do corte
  ideal_clip_s: 60     # duração que a IA mira
  max_clip_s: 90       # máximo quando a história pede (teto: 90)
  min_score: 7         # nota mínima da IA (0-10) pra virar clipe
  hype_threshold: 3.0
  cooldown_s: 120
  max_per_hour: 6
  max_live: 12         # quantas lives gravar ao mesmo tempo (cada uma usa ~6-8 Mbps de internet em 1080p)
  require_gta: true
  handle: "@seuperfil"
  accent: "#FF2E63"
  card_seconds: 4
  # 1080p60 é o máximo da Twitch e da Kick. "best" pega a maior de cada live (YouTube até 1440p/4K, bem mais
  # internet). Também dá pra trocar no painel: Ferramentas → Configurações → Qualidade da gravação.
  quality: "1080p60,1080p,936p60,900p60,720p60,720p,best"

